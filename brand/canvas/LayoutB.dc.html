<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout B — The desk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lato',system-ui,sans-serif;background:#102A43}
</style>
</helmet>
<div style="width: 800px; height: 1200px; box-sizing: border-box; background: #102A43; display: flex; flex-direction: column;">

  <div style="height: 720px; background: #1C3A57; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border-bottom: 6px solid #D6A23E;">
    <div style="width: 88px; height: 88px; border: 3px dashed #7E93A8; border-radius: 50%;"></div>
    <div style="font-family: 'Lato', sans-serif; font-size: 17px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: #9FB3C6;">Your photograph goes here</div>
    <div style="font-family: 'Lato', sans-serif; font-size: 16px; line-height: 1.6; color: #7E93A8; max-width: 440px; text-align: center;">Back view at the laptop. Jeans, navy hijab. Your own shoot &mdash; same framing every time.</div>
  </div>

  <div style="flex-grow: 1; padding: 56px 72px; display: flex; flex-direction: column; justify-content: center;">
    <div style="font-family: 'Libre Baskerville', Georgia, serif; font-size: 52px; line-height: 1.2; color: #FAF7F2;">What two hours on a Sunday actually buys</div>
    <div style="height: 24px;"></div>
    <div style="width: 96px; height: 6px; background: #D6A23E;"></div>
  </div>

  <div style="padding: 0 72px 48px 72px;">
    <div style="font-family: 'Lato', sans-serif; font-size: 18px; font-weight: 700; color: #FAF7F2; opacity: 0.6;">@karrienoor</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":1200}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
